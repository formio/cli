name: Repo

on:
  push:
    branches:
    - '**' # Every branch, including the ones with a slash in their name (feat/...), which '*' does not match.

env:
  NODE_VERSION: 22.x
  ADMIN_KEY: testAdminKey
  DOCKER_API_SRC_PORT: 4001
  DOCKER_API_DST_PORT: 4002
  DOCKER_MONGO_SRC: mongodb://mongo:27017/cli-test-src
  DOCKER_MONGO_DST: mongodb://mongo:27017/cli-test-dst
  LICENSE_REMOTE: false
  LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
  API_SRC: http://localhost:4001
  API_DST: http://localhost:4002
  MONGO_SRC: mongodb://localhost:27018/cli-test-src
  MONGO_DST: mongodb://localhost:27018/cli-test-dst

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Triggered by ${{ github.event_name }} event."
      - name: Check out repository code ${{ github.repository }} on ${{ github.ref }}
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The automatic cache asks the global Yarn 1 for its cache folder before Corepack is enabled,
          # which refuses to run in a project pinned to Yarn 4.
          package-manager-cache: false

      # Corepack provides the Yarn version pinned by the packageManager field of package.json.
      - name: Enable Corepack
        run: corepack enable

      - name: Installing dependencies
        run: yarn install --immutable

      - name: Test
        if: true
        run: yarn test
